<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Games Hub</title>
    <meta name="description" content="Juegos educativos: mates, palabras, geografía, idiomas y más.">
    <meta name="theme-color" content="#e4eaf7">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="platform/platform.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        // Never nest the shell inside itself
        if (window.self !== window.top) location.replace('home.html');
    </script>
</head>
<body class="hub-shell">
    <main class="hub-main loading" id="main-content">
        <iframe id="hub-frame" class="hub-frame" title="Games Hub" allow="fullscreen; autoplay"></iframe>
    </main>

    <script src="https://www.gstatic.com/firebasejs/11.9.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.9.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore-compat.js"></script>
    <script src="platform/firebase-config.js"></script>
    <script src="platform/i18n-platform.js"></script>
    <script src="platform/auth.js"></script>
    <script src="platform/firestore.js"></script>
    <script src="platform/platform-header.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => PlatformHeader.init({ rootPath: './', shell: true }));
    </script>
    <script src="platform/register-sw.js"></script>
</body>
</html>
